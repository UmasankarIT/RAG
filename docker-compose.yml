name: rag-chatbot

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: rag-chatbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ragchatbot
      POSTGRES_PASSWORD: ragchatbot_dev_password
      POSTGRES_DB: ragchatbot
    ports:
      - "5544:5432"
    volumes:
      - rag_chatbot_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragchatbot -d ragchatbot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rag_chatbot_pgdata:
